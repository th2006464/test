<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare 访问测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, system-ui, sans-serif;
            background: #f0f2f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 10px; }
        .title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; }
        .item {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .label { color: #666; }
        .value { color: #007aff; font-weight: 500; font-family: monospace; }
        .hint { font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">☁️</div>
        <div class="title">Cloudflare 节点追踪</div>
        
        <div class="item">
            <span class="label">IP 地址</span>
            <span id="ip" class="value">正在获取...</span>
        </div>
        <div class="item">
            <span class="label">国家/地区</span>
            <span id="country" class="value">正在获取...</span>
        </div>
        <div class="item">
            <span class="label">数据节点</span>
            <span id="colo" class="value">正在获取...</span>
        </div>

        <div class="hint">此数据直接由 Cloudflare 边缘节点提供</div>
    </div>

    <script>
        async function getCloudflareTrace() {
            try {
                const response = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                const text = await response.text();
                
                // 将返回的文本转换成对象
                const data = text.split('\n').reduce((obj, line) => {
                    const [key, value] = line.split('=');
                    if (key) obj[key] = value;
                    return obj;
                }, {});

                // 1. 显示 IP
                document.getElementById('ip').textContent = data.ip;

                // 2. 将国家代码转换为中文名称 (例如: CN -> 中国)
                try {
                    const regionNames = new Intl.DisplayNames(['zh-CN'], { type: 'region' });
                    const countryName = regionNames.of(data.loc);
                    document.getElementById('country').textContent = countryName + ' (' + data.loc + ')';
                } catch (e) {
                    document.getElementById('country').textContent = data.loc;
                }

                // 3. 显示 Cloudflare 数据中心代码 (例如: HKG 代表香港)
                document.getElementById('colo').textContent = data.colo;

            } catch (error) {
                console.error('Fetch failed:', error);
                document.querySelectorAll('.value').forEach(el => {
                    el.textContent = '获取失败';
                    el.style.color = 'red';
                });
            }
        }

        getCloudflareTrace();
    </script>
</body>
</html>
