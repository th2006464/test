<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <link rel="stylesheet" href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .full-height {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .success-box {
            text-align: center;
            padding: 30px;
        }
        .checkmark {
            font-size: 48px;
            color: #5cb85c;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container full-height">
        <div class="success-box">
            <div class="checkmark">✓</div>
            <h3>这是一个测试页面，你可以正确访问了</h3>
        </div>
    </div>
</body>

</html>
