<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f9fa;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 28px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .checkmark {
            font-size: 40px;
            color: #5cb85c;
            margin-bottom: 10px;
            line-height: 1;
        }
        .title {
            font-size: 16px;
            color: #333;
            margin-bottom: 18px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .item:last-child { border-bottom: none; }
        .label { color: #888; margin-right: 12px; }
        .value {
            font-weight: 500;
            color: #222;
            text-align: right;
            word-break: break-all;
        }
        .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .loading { color: #aaa; }
        .error { color: #d9534f; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="checkmark">✓</div>
            <div class="title">这是一个测试页面，你可以正确访问了</div>
            
            <div class="item">
                <span class="label">IP 地址</span>
                <span id="ip" class="value ip loading">···</span>
            </div>
            <div class="item">
                <span class="label">国家/地区</span>
                <span id="country" class="value loading">···</span>
            </div>
            <div class="item">
                <span class="label">城市</span>
                <span id="city" class="value loading">···</span>
            </div>
        </div>
    </div>

    <script>
        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('ip').textContent = data.ip;
                    document.getElementById('country').textContent = 
                        `${data.country_flag} ${data.country}`;
                    document.getElementById('city').textContent = 
                        data.city || '—';
                    
                    // 移除 loading 样式
                    ['ip','country','city'].forEach(id => {
                        document.getElementById(id).className = 'value';
                    });
                } else {
                    throw new Error('API 返回失败');
                }
            })
            .catch(err => {
                console.error('位置获取失败:', err);
                ['ip','country','city'].forEach(id => {
                    const el = document.getElementById(id);
                    el.textContent = '获取失败';
                    el.className = 'value error';
                });
            });
    </script>
</body>
</html>
