<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f9fa;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 28px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .checkmark {
            font-size: 40px;
            color: #5cb85c;
            margin-bottom: 10px;
            line-height: 1;
        }
        .title {
            font-size: 16px;
            color: #333;
            margin-bottom: 18px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .item:last-child { border-bottom: none; }
        .label { color: #888; margin-right: 12px; flex-shrink: 0; }
        .value {
            font-weight: 500;
            color: #222;
            text-align: right;
            word-break: break-all;
            flex: 1;
        }
        .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #007bff; }
        .loading { color: #aaa; font-style: italic; }
        .error { color: #d9534f; }
        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="checkmark">✓</div>
            <div class="title">网络连接测试</div>
            
            <div class="item">
                <span class="label">IP 地址</span>
                <span id="ip" class="value ip loading">获取中...</span>
            </div>
            <div class="item">
                <span class="label">国家/地区</span>
                <span id="country" class="value loading">获取中...</span>
            </div>
            <div class="item">
                <span class="label">城市</span>
                <span id="city" class="value loading">获取中...</span>
            </div>
            <div class="hint" id="hint">正在连接全球位置服务器...</div>
        </div>
    </div>

    <script>
        const setVal = (id, val, isErr = false) => {
            const el = document.getElementById(id);
            el.textContent = val;
            el.className = 'value' + (id === 'ip' ? ' ip' : '') + (isErr ? ' error' : '');
        };

        async function fetchLocation() {
            // 策略 1: 优先尝试 ip-api.com (国内访问较稳，不限HTTPS)
            try {
                const response = await fetch('https://demo.ip-api.com/json/?lang=zh-CN');
                const data = await response.json();
                if (data.status === 'success') {
                    return {
                        ip: data.query,
                        country: data.country,
                        city: data.city,
                        hint: '数据来自 IP-API'
                    };
                }
            } catch (e) { console.log('Primary API failed, trying backup...'); }

            // 策略 2: 备选 ipwho.is
            try {
                const response = await fetch('https://ipwho.is/?lang=zh-CN');
                const data = await response.json();
                if (data.success) {
                    return {
                        ip: data.ip,
                        country: `${data.country_flag || ''} ${data.country}`,
                        city: data.city,
                        hint: '数据来自 IPWhois'
                    };
                }
            } catch (e) { console.log('Backup API failed, trying Cloudflare...'); }

            // 策略 3: 最后保底方案 (Cloudflare Trace - 仅能稳定拿IP)
            try {
                const response = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                const text = await response.text();
                const ip = text.match(/ip=(.*)\n/)[1];
                return { ip, country: '未知', city: '未知', hint: '仅获取到IP，位置查询超载' };
            } catch (e) {
                return null;
            }
        }

        (async () => {
            const result = await fetchLocation();
            
            if (result) {
                setVal('ip', result.ip);
                setVal('country', result.country);
                setVal('city', result.city);
                document.getElementById('hint').textContent = `✅ ${result.hint}`;
            } else {
                ['ip','country','city'].forEach(id => setVal(id, '查询失败', true));
                document.getElementById('hint').textContent = '❌ 无法获取网络信息，请检查防火墙设置';
            }
        })();
    </script>
</body>
</html>
