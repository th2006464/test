<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f9fa;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 28px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        .checkmark {
            font-size: 40px;
            color: #5cb85c;
            margin-bottom: 10px;
            line-height: 1;
        }
        .title {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
        }
        .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .ip {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
        }
        .loading { color: #aaa; }
        .error { color: #d9534f; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="checkmark">✓</div>
            <div class="title">这是一个测试页面，你可以正确访问了</div>
            <div class="label">当前访问 IP</div>
            <div id="ip" class="ip loading">···</div>
        </div>
    </div>

    <script>
        fetch('https://api.ipify.org?format=json')
            .then(res => {
                if (!res.ok) throw new Error('请求失败');
                return res.json();
            })
            .then(data => {
                const ipEl = document.getElementById('ip');
                ipEl.textContent = data.ip || '未知';
                ipEl.className = 'ip';
            })
            .catch(err => {
                console.error('IP 获取失败:', err);
                const ipEl = document.getElementById('ip');
                ipEl.textContent = '获取失败';
                ipEl.className = 'ip error';
            });
    </script>
</body>
</html>
