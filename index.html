<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8f9fa;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 28px 36px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .checkmark {
            font-size: 40px;
            color: #5cb85c;
            margin-bottom: 10px;
            line-height: 1;
        }
        .title {
            font-size: 16px;
            color: #333;
            margin-bottom: 18px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .item:last-child { border-bottom: none; }
        .label { color: #888; margin-right: 12px; flex-shrink: 0; }
        .value {
            font-weight: 500;
            color: #222;
            text-align: right;
            word-break: break-all;
            flex: 1;
        }
        .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .loading { color: #aaa; }
        .error { color: #d9534f; }
        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="checkmark">✓</div>
            <div class="title">这是一个测试页面，你可以正确访问了</div>
            
            <div class="item">
                <span class="label">IP 地址</span>
                <span id="ip" class="value ip loading">···</span>
            </div>
            <div class="item">
                <span class="label">国家/地区</span>
                <span id="country" class="value loading">···</span>
            </div>
            <div class="item">
                <span class="label">城市</span>
                <span id="city" class="value loading">···</span>
            </div>
            <div class="hint" id="hint"></div>
        </div>
    </div>

    <script>
        // 降级策略：优先 ipapi.co → 失败则试 ipwho.is → 都失败则仅显示 IP（ipify）
        async function fetchLocation() {
            const APIs = [
                { name: 'ipapi.co', url: 'https://ipapi.co/json/' },
                { name: 'ipwho.is', url: 'https://ipwho.is/' }
            ];
            
            for (const api of APIs) {
                try {
                    const res = await fetch(api.url, { timeout: 5000 });
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    // 适配不同 API 的返回结构
                    if (api.name === 'ipapi.co' && data.ip) {
                        return {
                            ip: data.ip,
                            country: `${data.country_name || ''}`,
                            city: data.city || '',
                            flag: '' // ipapi.co 不直接返回 flag
                        };
                    }
                    if (api.name === 'ipwho.is' && data.success) {
                        return {
                            ip: data.ip,
                            country: `${data.country_flag || ''} ${data.country || ''}`.trim(),
                            city: data.city || '',
                            flag: data.country_flag
                        };
                    }
                } catch (e) {
                    console.warn(`${api.name} 请求失败:`, e);
                    continue;
                }
            }
            // 全部失败：仅获取 IP
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return { ip: data.ip, country: '—', city: '—', partial: true };
            } catch {
                return null;
            }
        }

        // 执行获取 + 渲染
        (async () => {
            const result = await fetchLocation();
            const setVal = (id, val, isErr = false) => {
                const el = document.getElementById(id);
                el.textContent = val;
                el.className = 'value' + (isErr ? ' error' : '');
            };

            if (result) {
                setVal('ip', result.ip);
                setVal('country', result.country || '—');
                setVal('city', result.city || '—');
                if (result.partial) {
                    document.getElementById('hint').textContent = 'ℹ️ 位置信息获取受限，仅显示 IP';
                }
            } else {
                ['ip','country','city'].forEach(id => setVal(id, '获取失败', true));
                document.getElementById('hint').textContent = '🔍 请检查网络连接，或稍后刷新重试';
            }
        })();
    </script>
</body>
</html>
